[project]
name = "resume-ai"
version = "0.1.0"
description = "Recherche en langage naturel dans une base de CV (Word/PDF)"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.55",
    "pydantic>=2.7",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Couche de score locale. Entraîne torch et transformers, plus environ 650 Mo de
# poids au premier appel : le reste du système doit rester installable sans.
score = ["laya>=0.3"]

[project.scripts]
resume-ai = "resume_ai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
